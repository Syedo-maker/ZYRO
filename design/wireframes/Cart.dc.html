<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; background: oklch(98% 0.005 260); color: oklch(19% 0.02 265); }
    h1, h2, h3 { font-family: 'Space Grotesk', system-ui, sans-serif; margin: 0; }
    a { color: oklch(58% 0.16 265); text-decoration: none; }
    a:hover { color: oklch(50% 0.17 265); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; height: 48px; padding: 0 20px; }
  </style>
</helmet>

<div style="width: 1040px; min-height: 900px; background: oklch(98% 0.005 260); display: flex; flex-direction: column;">
  <div style="display: flex; align-items: center; padding: 0 40px; height: 72px; background: white; border-bottom: 1px solid oklch(91% 0.006 260); font-size: 22px; font-weight: 700;">ZYRO</div>

  <div style="padding: 32px 40px;">
    <h1 style="font-size: 24px; margin-bottom: 24px;">Your cart</h1>

    <div style="display: flex; gap: 32px; align-items: flex-start;">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 16px;">

        <div style="display: flex; gap: 16px; background: white; border: 1px solid oklch(91% 0.006 260); border-radius: 14px; padding: 16px;">
          <div style="width: 84px; height: 84px; background: oklch(95% 0.004 260); border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="oklch(80% 0.006 260)" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
            <div style="font-size: 14px; font-weight: 600;">Wireless Earbuds Pro</div>
            <div style="font-size: 12px; color: oklch(63% 0.015 265);">Color: Midnight Black</div>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px;">
              <div style="display: flex; align-items: center; border: 1px solid oklch(91% 0.006 260); border-radius: 8px; height: 32px;">
                <div style="width: 30px; display: flex; align-items: center; justify-content: center; font-size: 14px;">−</div>
                <div style="width: 30px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; border-left: 1px solid oklch(91% 0.006 260); border-right: 1px solid oklch(91% 0.006 260); height: 100%;">1</div>
                <div style="width: 30px; display: flex; align-items: center; justify-content: center; font-size: 14px;">+</div>
              </div>
              <div style="display: flex; align-items: center; gap: 16px;">
                <div style="font-size: 15px; font-weight: 700;">$49.00</div>
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="oklch(63% 0.015 265)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
              </div>
            </div>
          </div>
        </div>

        <div style="display: flex; gap: 16px; background: white; border: 1px solid oklch(91% 0.006 260); border-radius: 14px; padding: 16px;">
          <div style="width: 84px; height: 84px; background: oklch(95% 0.004 260); border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="oklch(80% 0.006 260)" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
            <div style="font-size: 14px; font-weight: 600;">Ceramic Pour-Over Set</div>
            <div style="font-size: 12px; color: oklch(63% 0.015 265);">Glaze: Sand</div>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px;">
              <div style="display: flex; align-items: center; border: 1px solid oklch(91% 0.006 260); border-radius: 8px; height: 32px;">
                <div style="width: 30px; display: flex; align-items: center; justify-content: center; font-size: 14px;">−</div>
                <div style="width: 30px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; border-left: 1px solid oklch(91% 0.006 260); border-right: 1px solid oklch(91% 0.006 260); height: 100%;">2</div>
                <div style="width: 30px; display: flex; align-items: center; justify-content: center; font-size: 14px;">+</div>
              </div>
              <div style="display: flex; align-items: center; gap: 16px;">
                <div style="font-size: 15px; font-weight: 700;">$76.00</div>
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="oklch(63% 0.015 265)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- Summary -->
      <div style="width: 320px; background: white; border: 1px solid oklch(91% 0.006 260); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 16px;">
        <div style="font-size: 15px; font-weight: 700;">Order summary</div>

        <div style="display: flex; gap: 8px;">
          <div style="flex: 1; background: oklch(96% 0.004 260); border-radius: 10px; padding: 10px 14px; font-size: 13px; color: oklch(63% 0.015 265);">Discount code</div>
          <div class="btn" style="background: white; border: 1px solid oklch(91% 0.006 260); height: auto; padding: 0 16px; color: oklch(19% 0.02 265);">Apply</div>
        </div>

        <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: oklch(58% 0.13 150);">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="oklch(58% 0.13 150)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          SAVE10 applied
        </div>

        <div style="height: 1px; background: oklch(91% 0.006 260);"></div>

        <div style="display: flex; flex-direction: column; gap: 10px; font-size: 13px; color: oklch(46% 0.02 265);">
          <div style="display: flex; justify-content: space-between;"><span>Subtotal</span><span style="color: oklch(19% 0.02 265); font-weight: 600;">$125.00</span></div>
          <div style="display: flex; justify-content: space-between;"><span>Discount</span><span style="color: oklch(58% 0.13 150); font-weight: 600;">−$12.50</span></div>
          <div style="display: flex; justify-content: space-between;"><span>Shipping</span><span style="color: oklch(19% 0.02 265); font-weight: 600;">$6.00</span></div>
        </div>

        <div style="height: 1px; background: oklch(91% 0.006 260);"></div>

        <div style="display: flex; justify-content: space-between; font-size: 16px; font-weight: 700;"><span>Total</span><span>$118.50</span></div>

        <div class="btn" style="background: oklch(58% 0.16 265); color: white; margin-top: 8px;">Proceed to checkout</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
