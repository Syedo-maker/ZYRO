# Sent with every page and file. Kept in one file because nginx drops a server's add_header lines
# in any location that adds its own, so each location includes this instead.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# The microphone is for merchants' voice notes; nothing else on the page may use a device.
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), microphone=(self)" always;
# Scripts only from ZYRO itself (the build has no inline script). Inline style attributes are
# allowed because React sets some (the storefront's brand colour, chart widths). Images and voice
# recordings may come from Blob Storage over HTTPS; a recording in progress is a blob: URL.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' blob: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
