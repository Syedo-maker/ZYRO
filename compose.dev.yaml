# Zyro for local development, the whole stack in Docker: PostgreSQL, MongoDB, Redis, the API, the
# worker and the web app, with the source mounted in so code changes are picked up.
#
#   docker compose -f compose.dev.yaml up -d --build     then open http://localhost:5173
#   docker compose -f compose.dev.yaml logs -f api        follow one service
#   docker compose -f compose.dev.yaml down -v            stop and delete everything, data included
#
# For a production-like run (built images, nginx in front, NODE_ENV=production, object storage) use
# compose.yaml instead. This file is for writing code: development settings, readable logs, files on
# the local disk, and no paid services (leave their keys empty; those features say "not set up").
#
# Ports: the web app on 5173 and the API on 5000, as with `npm run dev`, so stop those first. The
# databases are published on other ports (55432, 57017, 56379) so they do not clash with any already
# running on this machine. Every secret here is a throwaway for this machine only.
#
# File changes are picked up by polling (file events do not cross the Docker Desktop mount on Windows).
name: zyro-dev

x-backend-env: &backend-env
  NODE_ENV: development
  APP_ENV: development
  DATABASE_URL: postgresql://zyro:dev-only-postgres@postgres:5432/zyro?schema=public
  MONGODB_URI: mongodb://mongo:27017/zyro
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: dev-only-jwt-secret-not-for-production
  PUBLIC_URL: http://localhost:5000
  CORS_ORIGIN: http://localhost:5173
  STOREFRONT_URL: http://localhost:5173
  STORAGE_DRIVER: local
  # The worker runs as its own service, as in production.
  RUN_WORKERS_IN_API: "false"
  # File change events do not cross the Docker Desktop mount on Windows, so the watcher polls.
  CHOKIDAR_USEPOLLING: "true"
  CHOKIDAR_INTERVAL: "1000"
  # Optional: pass real test keys through from your shell to try payments or AI.
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  postgres:
    image: postgres:17.11-alpine
    environment: { POSTGRES_USER: zyro, POSTGRES_PASSWORD: dev-only-postgres, POSTGRES_DB: zyro }
    ports: ["127.0.0.1:55432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U zyro"], interval: 3s, retries: 30 }

  mongo:
    image: mongo:8.0.38
    ports: ["127.0.0.1:57017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck: { test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"], interval: 5s, retries: 30 }

  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: [redis-data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 30 }

  # Applies the database migrations once, then the API and worker start.
  migrate:
    build: { context: ./backend, target: deps }
    image: zyro-backend-dev:local
    working_dir: /app
    command: ["sh", "-c", "npx prisma migrate deploy"]
    environment: { DATABASE_URL: "postgresql://zyro:dev-only-postgres@postgres:5432/zyro?schema=public" }
    volumes: [./backend/prisma:/app/prisma]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: zyro-backend-dev:local
    working_dir: /app
    # The source is mounted in; node_modules stays the image's own (Linux) copy, in a volume. When
    # package-lock.json changes the volume would keep the old packages, so each start compares the
    # lockfile with the one last installed and runs npm ci when they differ.
    command: ["sh", "-c", "[ \"$$(cat node_modules/.zyro-lock 2>/dev/null)\" = \"$$(sha256sum package-lock.json | cut -c1-64)\" ] || { echo 'package-lock.json changed: installing packages'; npm ci --no-audit --no-fund && sha256sum package-lock.json | cut -c1-64 > node_modules/.zyro-lock; }; npx prisma generate && npx tsx watch src/index.ts"]
    environment:
      <<: *backend-env
      PORT: "5000"
    ports: ["127.0.0.1:5000:5000"]
    volumes: [./backend:/app, backend-node-modules:/app/node_modules]
    depends_on:
      migrate: { condition: service_completed_successfully }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 60

  worker:
    image: zyro-backend-dev:local
    working_dir: /app
    # Starts after the API, which has already brought the shared node_modules up to date.
    command: ["sh", "-c", "npx prisma generate && npx tsx watch src/worker.ts"]
    environment:
      <<: *backend-env
      WORKER_HEALTH_PORT: "5001"
    volumes: [./backend:/app, backend-node-modules:/app/node_modules]
    depends_on:
      api: { condition: service_healthy }

  web:
    build: { context: ./frontend, target: deps }
    image: zyro-web-dev:local
    working_dir: /app
    command: ["sh", "-c", "[ \"$$(cat node_modules/.zyro-lock 2>/dev/null)\" = \"$$(sha256sum package-lock.json | cut -c1-64)\" ] || { echo 'package-lock.json changed: installing packages'; npm ci --no-audit --no-fund && sha256sum package-lock.json | cut -c1-64 > node_modules/.zyro-lock; }; npx vite --host 0.0.0.0 --port 5173"]
    environment:
      VITE_DEV_API_TARGET: http://api:5000
      VITE_DEV_POLLING: "true"
    ports: ["127.0.0.1:5173:5173"]
    volumes: [./frontend:/app, web-node-modules:/app/node_modules]
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data: {}
  mongo-data: {}
  redis-data: {}
  backend-node-modules: {}
  web-node-modules: {}
