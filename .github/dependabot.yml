# Weekly dependency update pull requests. Minor and patch updates are grouped into one pull request
# per ecosystem so they are quick to review; major versions come one at a time (they can break
# things and need their own test run). CI runs on every one of them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: pip
    directory: /recommendation-service
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      python-minor-and-patch: { update-types: [minor, patch] }

  # Base images are pinned to exact versions in the Dockerfiles and compose files; these propose the
  # updates.
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: docker
    directory: /recommendation-service
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
