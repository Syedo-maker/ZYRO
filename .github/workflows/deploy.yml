# Releases to Azure: every green build of main goes to staging; production gets the exact same
# images once a person approves it in the "production" GitHub environment.
#
# Nothing runs until the owners have provisioned the environments and set these in each GitHub
# environment (Settings > Environments > staging / production), as described in
# documentation/Deployment_Runbook.md:
#   variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP
#   production also: STAGING_REGISTRY_ID (the staging registry's resource id, to copy images from)
# and, at repository level, DEPLOY_ENABLED=true. Until then every job here is skipped.
# Sign-in is OpenID Connect (federated credentials): there is no Azure password or key in GitHub.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit to release (defaults to the latest on main)"
        required: false

permissions:
  contents: read
  id-token: write

# One release at a time per environment; a newer one waits rather than racing it.
concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

env:
  REF: ${{ github.event.inputs.ref || github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    name: Build and push images
    # A repository variable, because environment variables are not yet known when a job's `if` runs.
    if: ${{ vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: staging
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - id: tag
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in to the staging registry
        run: |
          ACR=$(az acr list -g "${{ vars.AZURE_RESOURCE_GROUP }}" --query "[0].name" -o tsv)
          echo "ACR=$ACR" >> "$GITHUB_ENV"
          echo "REGISTRY=$(az acr show -n "$ACR" --query loginServer -o tsv)" >> "$GITHUB_ENV"
          az acr login -n "$ACR"
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker buildx build --push --tag "$REGISTRY/zyro-web:$TAG" frontend
          docker buildx build --push --tag "$REGISTRY/zyro-api:$TAG" --target runtime backend
          docker buildx build --push --tag "$REGISTRY/zyro-migrate:$TAG" --target migrate backend
          docker buildx build --push --tag "$REGISTRY/zyro-reco:$TAG" recommendation-service

  staging:
    name: Release to staging
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Migrate, release blue-green, smoke test, roll back on failure
        run: bash infra/scripts/release.sh "${{ vars.AZURE_RESOURCE_GROUP }}" "${{ needs.build.outputs.tag }}"

  production:
    name: Release to production
    needs: [build, staging]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Required reviewers on this environment are the approval step: nothing reaches paying
    # merchants without a person saying so.
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Copy the images staging tested into the production registry (no rebuild)
        env:
          TAG: ${{ needs.build.outputs.tag }}
          STAGING_REGISTRY_ID: ${{ vars.STAGING_REGISTRY_ID }}
        run: |
          ACR=$(az acr list -g "${{ vars.AZURE_RESOURCE_GROUP }}" --query "[0].name" -o tsv)
          for image in zyro-web zyro-api zyro-migrate zyro-reco; do
            az acr import --name "$ACR" --source "$image:$TAG" --registry "$STAGING_REGISTRY_ID" --force --only-show-errors
          done
      - name: Migrate, release blue-green, smoke test, roll back on failure
        run: bash infra/scripts/release.sh "${{ vars.AZURE_RESOURCE_GROUP }}" "${{ needs.build.outputs.tag }}"
