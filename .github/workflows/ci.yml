# Every push and pull request: the whole test suite against real databases, the frontend checks,
# the Python service's tests, and a build of every production image. A pull request cannot be
# trusted to merge until this passes.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (1,700+ tests, contract conformance, coverage floors)
    # Not 24.04: MongoDB 8.0 refuses to start on Linux 6.19 or newer (MongoDB SERVER-121912), the
    # kernel GitHub's 24.04 runners moved to in October 2026; the first CI run failed on exactly
    # that. 22.04 runs an older kernel. Move back once MongoDB ships the fix. Production uses Atlas
    # and is not affected.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: zyro, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: zyro }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zyro" --health-interval 5s --health-retries 20
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'" --health-interval 5s --health-retries 20
      redis:
        # The major version Azure Managed Redis runs.
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://zyro:ci-only@localhost:5432/zyro?schema=public
      MONGODB_URI: mongodb://localhost:27017/zyro
      REDIS_URL: redis://localhost:6379
      # Test-only values; the tests never talk to a real paid service (tests/real is separate).
      JWT_ACCESS_SECRET: ci-only-not-a-real-secret-0123456789abcdef
      AZURITE: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: recommendation-service/requirements.txt
      # The recommendation tests start the Python service from its own virtual environment.
      - name: Python service environment
        working-directory: recommendation-service
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      # Started here rather than as a service: it needs flags a service container cannot be given
      # (the storage SDK is newer than this emulator's API version check).
      - name: Azurite (Blob Storage emulator)
        working-directory: .
        run: docker run -d -p 10000:10000 mcr.microsoft.com/azure-storage/azurite:3.35.0 azurite-blob --blobHost 0.0.0.0 --loose --skipApiVersionCheck
      - run: npm ci
      - run: npx prisma generate
      - name: Migrations apply cleanly to an empty database
        run: npx prisma migrate deploy
      - name: Type check (source and tests)
        run: npx tsc -p tsconfig.json --noEmit && npm run typecheck:tests
      - name: Tests, with every response checked against openapi.yaml
        run: npx jest --coverage
        env:
          AZURITE_BLOB_ENDPOINT: http://127.0.0.1:10000/devstoreaccount1
      - name: Dependency audit (production dependencies)
        # "critical" until the Prisma 7 upgrade clears the known high advisory in the Prisma CLI
        # (Production_Readiness.md, Phase 3, "Accepted for now").
        run: npm audit --omit=dev --audit-level=critical

  frontend:
    name: Frontend (types, lint, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  reco:
    name: Recommendation service (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: recommendation-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: recommendation-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  images:
    name: Production images build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: web
        run: docker build --tag zyro-web:ci frontend
      - name: api and worker
        run: docker build --tag zyro-api:ci --target runtime backend
      - name: migrate
        run: docker build --tag zyro-migrate:ci --target migrate backend
      - name: recommendation service (models included)
        run: docker build --tag zyro-reco:ci recommendation-service
