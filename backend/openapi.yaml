openapi: 3.1.0
info:
  title: ZYRO API
  summary: Multi-tenant e-commerce platform with built-in AI content generation and shopping assistant.
  description: |
    This is the API contract draft for Phase 0, Module 3 of the ZYRO (ShopMind AI) implementation
    plan. It consolidates the endpoints sketched per-phase in `documentation/Implementation_Plan.md`
    into one consistent, code-gen-friendly contract so frontend and backend work (owned by different
    students per the scope document's Section 12 module split) can proceed in parallel without
    integration surprises.

    ## Multi-tenancy

    Every tenant-scoped resource is nested under `/stores/{storeId}/...`. `storeId` must always be
    supplied explicitly, this mirrors the tenant-scoping design from Phase 0 Module 1 (Prisma
    middleware and the Mongoose `tenantScopePlugin` both refuse a query with no tenant filter), so the
    API surface makes the same requirement visible to callers rather than inferring it silently.

    ## Auth model

    - `bearerAuth`: JWT access token. Required for all merchant/staff actions and any action tied to
      a logged-in customer account.
    - `guestSession`: an opaque guest session id (issued on first cart interaction, carried in the
      `X-Guest-Session-Id` header). Storefront browsing, cart, and checkout endpoints accept either
      `bearerAuth` OR `guestSession`, since Section 6 of the scope document requires guest checkout to
      work without an account.
  version: "0.1.0-draft"

servers:
  - url: /api/v1
    description: Single backend, path-versioned; hostname/subdomain routing per store is handled
      upstream of this contract.

tags:
  - name: auth
    description: Merchant and customer authentication.
  - name: users
    description: The authenticated caller's own account data.
  - name: stores
    description: Store profile, branding, and staff management.
  - name: catalog
    description: Product catalog browsing and management.
  - name: reviews
    description: Customer product reviews.
  - name: uploads
    description: Media uploads (product images, store logos).
  - name: ai-content
    description: AI-generated product description tooling.
  - name: cart
    description: Shopping cart.
  - name: checkout
    description: Checkout and payment.
  - name: orders
    description: Order and shipment management.
  - name: pos
    description: Point of sale, the in-store sales channel over the same orders, inventory and customers as the online store.
  - name: shipping
    description: Shipping zone configuration.
  - name: discounts
    description: Discount code management and validation.
  - name: ai-assistant
    description: AI shopping assistant chat.
  - name: analytics
    description: Sales and marketing analytics.
  - name: webhooks
    description: Inbound webhooks from third-party providers.

security:
  - bearerAuth: []

paths:
  # ── AUTH ──────────────────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [auth]
      operationId: auth_register
      summary: Register a merchant and create their first store
      description: |
        Creates a new `User` (role: merchant owner) and their first `Tenant` in a single
        transaction, per Implementation_Plan.md Phase 1. Returns an access token and sets
        the refresh token as an httpOnly cookie (`refreshToken`, path `/api/v1/auth`),
        never in the JSON body, so it isn't reachable from JavaScript/XSS.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, storeName, storeSlug]
              properties:
                email: { type: string, format: email }
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                  description: |
                    At most 72 bytes (72 characters for plain text, fewer for accented or other
                    multi-byte characters), because the hashing algorithm ignores anything
                    beyond that and would silently accept a different password.
                storeName: { type: string, maxLength: 120 }
                storeSlug: { type: string, pattern: "^[a-z0-9-]{3,50}$" }
            examples:
              new_merchant:
                value:
                  email: sam@auroragoods.example
                  password: correct-horse-battery-staple
                  storeName: Aurora Home Goods
                  storeSlug: aurora-home-goods
      responses:
        "201":
          description: Merchant and store created. A `Set-Cookie` header carries the httpOnly refresh token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "409":
          description: Email or store slug already taken
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/login:
    post:
      tags: [auth]
      operationId: auth_login
      summary: Log in with email and password
      description: |
        Returns an access token; the refresh token is set as an httpOnly cookie (see `auth_register`).
        Only failed attempts count toward the limit: five wrong passwords for one email from one
        address blocks that pair for 15 minutes (429, even for the correct password), and 30 failures
        from one address across any emails blocks the address. Unknown emails and wrong passwords
        give the same answer in the same time, so a caller cannot tell which emails are registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Authenticated. A `Set-Cookie` header carries the httpOnly refresh token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401":
          description: Invalid credentials
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: auth_refresh
      summary: Exchange the refresh token cookie for a new access token
      description: |
        Reads the `refreshToken` httpOnly cookie set by `auth_register`/`auth_login`;
        takes no request body. The refresh token is rotated on every use (the old one is
        deleted and a new one issued via `Set-Cookie`) so a stolen, already-used token
        cannot be replayed.
      security: []
      responses:
        "200":
          description: New access token issued; refresh token cookie rotated.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken]
                properties:
                  accessToken: { type: string }
        "401":
          description: Refresh token cookie missing, invalid, or expired
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: auth_logout
      summary: Revoke the current refresh token
      description: |
        Deletes the server-side record backing the `refreshToken` cookie (so it can no
        longer be exchanged via `auth_refresh`) and clears the cookie. Idempotent: calling
        this with no cookie or an already-revoked token still returns 204.
      responses:
        "204":
          description: Logged out

  # ── USERS ─────────────────────────────────────────────────────────────
  /users/me:
    get:
      tags: [users]
      operationId: users_me_get
      summary: Get the authenticated caller's own profile
      description: |
        Added alongside `users_me_stores_list`: after a page reload, the frontend only
        has a fresh access token from `auth_refresh` (which returns no user data), so it
        needs somewhere to fetch "who am I" from.
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /users/me/stores:
    get:
      tags: [users]
      operationId: users_me_stores_list
      summary: List the stores the authenticated caller owns or is staff at
      description: |
        Added during Phase 1's frontend module: without this, a frontend has no way to
        discover which storeId(s) to operate on after login: auth_register/auth_login
        return the User but never a Tenant. Inherently cross-tenant (a caller's own
        memberships span stores by definition), so it's implemented against an
        intentionally unscoped Prisma client, always filtered by the caller's own user id;
        see backend/src/lib/prisma.ts's `prismaUnscoped` export.
      responses:
        "200":
          description: Stores this user can access
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/Store"
                    - type: object
                      required: [role]
                      properties:
                        role:
                          type: string
                          enum: [owner, staff]

  # ── STORES ────────────────────────────────────────────────────────────
  /stores/{storeId}:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [stores]
      operationId: stores_get
      summary: Get a store's public profile
      description: Public; used by the storefront to render branding before any auth check.
      security: []
      responses:
        "200":
          description: Store profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        "404": { $ref: "#/components/responses/NotFound" }

  /stores/{storeId}/branding:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    patch:
      tags: [stores]
      operationId: store_branding_update
      summary: Update store name, logo, and theme color
      description: Owner-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                logoUrl: { type: string, format: uri }
                themeColor: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /stores/{storeId}/staff:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [stores]
      operationId: store_staff_list
      summary: List staff accounts for a store
      description: Owner-only.
      responses:
        "200":
          description: Staff list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StaffMember" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [stores]
      operationId: store_staff_create
      summary: Invite a staff account with scoped permissions
      description: Owner-only. Permissions gate access to specific routes (Section 6/7.2 role-based access).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, permissions]
              properties:
                email: { type: string, format: email }
                name:
                  type: string
                  maxLength: 120
                  description: Only used when this call creates the account (a new cashier).
                password:
                  type: string
                  minLength: 8
                  description: |
                    Give a starting password to create a new account for someone who has none
                    (a new cashier). Rejected with 400 if the email already has an account, so
                    an owner can never set another person's password.
                permissions:
                  type: array
                  items: { $ref: "#/components/schemas/StaffPermission" }
            examples:
              catalog_staff:
                value:
                  email: jordan@auroragoods.example
                  permissions: [products_write]
              new_cashier:
                value:
                  email: riley@auroragoods.example
                  name: Riley Chen
                  password: a-starting-password
                  permissions: [pos_sell]
      responses:
        "201":
          description: Staff account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMember" }
        "400":
          description: Invalid email, empty or unknown permissions (names are lowercase), a too-short or too-long password, or a password sent for an email that already has an account
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No ZYRO account exists for that email and no password was given to create one
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Already staff at this store, or the person is the store owner (who already has full access)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }

  /stores/{storeId}/staff/{staffId}:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - name: staffId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [stores]
      operationId: store_staff_delete
      summary: Remove a staff account
      description: Owner-only.
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── CATALOG ───────────────────────────────────────────────────────────
  /stores/{storeId}/products:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [catalog]
      operationId: products_list
      summary: Browse or search a store's product catalog
      description: |
        Public. Browsing and search are one endpoint (a search is a filtered list, not a
        separate resource). `q` uses the MongoDB text index over title, category and description,
        where a title match outranks a category match, which outranks a description match, and
        `sort=relevance` (the default with `q`) ranks best first. If the text search finds nothing,
        for example a partial word such as `cer` for "Ceramic", it falls back to a case-insensitive
        contains match on title and category, ordered by title. Regex characters in `q` are plain
        text. An empty `q` means browse. Each product carries its average rating and review count,
        computed on read from published reviews; the catalog cannot be sorted or filtered by rating
        (that would need a stored average, which the plan avoids).
      security: []
      parameters:
        - name: q
          in: query
          description: "Keyword search across title, category and description (at most 100 characters)."
          schema: { type: string, maxLength: 100 }
        - name: category
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          description: "Inclusive lower bound on price."
          schema: { type: number, minimum: 0 }
        - name: maxPrice
          in: query
          description: "Inclusive upper bound on price; not less than minPrice."
          schema: { type: number, minimum: 0 }
        - name: inStock
          in: query
          description: "true leaves out products with no stock on hand."
          schema: { type: boolean }
        - name: sort
          in: query
          description: "relevance ranks search matches best first (newest when there is no `q`)."
          schema: { type: string, enum: [relevance, newest, price_asc, price_desc, title], default: relevance }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Product page
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
                  pagination: { $ref: "#/components/schemas/PaginationInfo" }
    post:
      tags: [catalog]
      operationId: products_create
      summary: Create a product
      description: Requires the `products_write` staff permission (or owner).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /stores/{storeId}/products/suggest:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [catalog]
      operationId: products_suggest
      summary: Search-box suggestions
      description: "Public. Up to 8 products with a title word that starts with `q`, sorted by title; for a type-ahead box. Matching is case-insensitive and regex characters are plain text."
      security: []
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 60 } }
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    title: { type: string }
                    category: { type: string }
        "400":
          description: A missing or empty query
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }

  /stores/{storeId}/products/{productId}:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - $ref: "#/components/parameters/ProductId"
    get:
      tags: [catalog]
      operationId: products_get
      summary: Get a single product
      security: []
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [catalog]
      operationId: products_update
      summary: Replace a product's editable fields
      description: Requires the `products_write` staff permission (or owner).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [catalog]
      operationId: products_delete
      summary: Delete a product
      description: Requires the `products_write` staff permission (or owner).
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── UPLOADS ───────────────────────────────────────────────────────────
  /stores/{storeId}/uploads/images:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    post:
      tags: [uploads]
      operationId: uploads_image_create
      summary: Upload a single image and get back its URL
      description: |
        `ProductInput.images` and `store_branding_update`'s `logoUrl` both take
        already-hosted URLs, not raw file data; this endpoint is what produces one.
        Added during Phase 1 Module 4 implementation: the original contract modeled
        product/branding images as pre-existing URLs without ever specifying how a URL
        comes to exist, which is a real gap once you try to build the upload flow.
        Requires the `products_write` staff permission (or owner). Stores the file to
        local disk for this prototype (Implementation_Plan.md Phase 1 names this as the
        deferred choice between S3-compatible object storage and local disk) and returns
        its served URL, never the binary itself, which is never persisted to a database.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG, or WebP, up to 5 MB.
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        "400":
          description: Missing file, or an unsupported type/size
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── REVIEWS ───────────────────────────────────────────────────────────
  /stores/{storeId}/products/{productId}/reviews:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - $ref: "#/components/parameters/ProductId"
    get:
      tags: [reviews]
      operationId: reviews_list
      summary: List a product's reviews with its rating summary
      description: |
        Public. Only published reviews, with the average rating, the count and the star
        breakdown computed on read from them (Implementation_Plan.md Phase 3: not stored on the
        product). The reviewer's id and email are never exposed; only the name as it is shown
        ("Sam O."). A signed-in shopper also gets `myReview` (their own, even if hidden) so the
        page can offer edit and delete; a missing or invalid token just means signed out.
      security: []
      parameters:
        - { name: sort, in: query, schema: { type: string, enum: [newest, oldest, highest, lowest], default: newest } }
        - { name: rating, in: query, description: "Only reviews with this many stars; the summary still describes all reviews.", schema: { type: integer, minimum: 1, maximum: 5 } }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 50 } }
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Review page
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination, averageRating, reviewCount, distribution]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ProductReview" }
                  pagination: { $ref: "#/components/schemas/PaginationInfo" }
                  averageRating: { type: [number, "null"], description: "Two decimals; null when the product has no published reviews." }
                  reviewCount: { type: integer }
                  distribution:
                    type: object
                    description: "How many reviews gave each number of stars."
                    properties:
                      "1": { type: integer }
                      "2": { type: integer }
                      "3": { type: integer }
                      "4": { type: integer }
                      "5": { type: integer }
                  myReview:
                    oneOf:
                      - { $ref: "#/components/schemas/OwnReview" }
                      - { type: "null" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [reviews]
      operationId: reviews_create
      summary: Leave a review for a product
      description: |
        Requires a signed-in account; one review per person per product. Any account may review;
        `verifiedPurchase` is true when the reviewer has a paid order in this store containing
        the product that was not refunded or cancelled (checked when the review is written).
        The store's owner and staff cannot review their own products (403). Text is stored as
        plain text with control characters removed. At most 10 review writes (create, edit,
        delete) per person per hour (429).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                title: { type: string, maxLength: 100 }
                comment: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnReview" }
        "400":
          description: A rating that is not a whole number from 1 to 5, or text that is too long
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { description: Not signed in }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The person has already reviewed this product
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /stores/{storeId}/products/{productId}/reviews/mine:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - $ref: "#/components/parameters/ProductId"
    put:
      tags: [reviews]
      operationId: reviews_update_mine
      summary: Edit your own review
      description: "Changes only the fields sent. Keeps its place and its verified badge; a review the store has hidden stays hidden."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                title: { type: string, maxLength: 100 }
                comment: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnReview" }
        "400":
          description: Nothing to change, or an invalid value
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { description: Not signed in }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      tags: [reviews]
      operationId: reviews_delete_mine
      summary: Delete your own review
      description: "Removes it from the page and the average. You can write a new one afterwards."
      responses:
        "204": { description: Deleted }
        "401": { description: Not signed in }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /stores/{storeId}/reviews:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [reviews]
      operationId: reviews_moderation_list
      summary: Every review in the store, hidden ones included
      description: "Requires the `products_write` staff permission (or owner). Newest first, with the product title."
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [published, hidden] } }
        - { name: productId, in: query, schema: { type: string } }
        - { name: rating, in: query, schema: { type: integer, minimum: 1, maximum: 5 } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ModerationReview" }
                  pagination: { $ref: "#/components/schemas/PaginationInfo" }
        "401": { description: Not signed in }
        "403": { $ref: "#/components/responses/Forbidden" }

  /stores/{storeId}/reviews/{reviewId}:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - name: reviewId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [reviews]
      operationId: reviews_moderate
      summary: Hide or show a review, and reply to it
      description: |
        Requires the `products_write` staff permission (or owner). A hidden review is kept
        but not shown or counted, and its author cannot post another. The reviewer's own words
        are never edited. `reply` adds or changes the store's public reply; null removes it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [published, hidden] }
                reply: { type: [string, "null"], maxLength: 1000 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationReview" }
        "400":
          description: Nothing to change, or an invalid value
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  # ── AI CONTENT ────────────────────────────────────────────────────────
  /stores/{storeId}/products/{productId}/ai-description/generate:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - $ref: "#/components/parameters/ProductId"
    post:
      tags: [ai-content]
      operationId: ai_content_generate
      summary: Generate a draft AI product description
      description: |
        Enqueues an AI orchestrator job (Implementation_Plan.md Phase 4). Checked against
        `AiUsageQuota` before enqueueing; quota is only decremented on success. Requires the
        `products_write` staff permission (or owner).
      responses:
        "202":
          description: Generation queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiGeneratedContent" }
        "402":
          description: Monthly AI usage quota exhausted
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /stores/{storeId}/products/{productId}/ai-description:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - $ref: "#/components/parameters/ProductId"
    patch:
      tags: [ai-content]
      operationId: ai_content_update
      summary: Edit the draft AI description before publishing
      responses:
        "200":
          description: Draft updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiGeneratedContent" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /stores/{storeId}/products/{productId}/ai-description/regenerate:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - $ref: "#/components/parameters/ProductId"
    post:
      tags: [ai-content]
      operationId: ai_content_regenerate
      summary: Re-run generation, replacing the current draft
      description: Consumes one AI generation from the monthly quota, same as `ai_content_generate`.
      responses:
        "202":
          description: Regeneration queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiGeneratedContent" }
        "402":
          description: Monthly AI usage quota exhausted
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }

  /stores/{storeId}/products/{productId}/ai-description/publish:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - $ref: "#/components/parameters/ProductId"
    post:
      tags: [ai-content]
      operationId: ai_content_publish
      summary: Publish the current draft as the product's live description
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /stores/{storeId}/ai-usage:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [ai-content]
      operationId: ai_usage_get
      summary: Get this store's AI usage for the current month
      responses:
        "200":
          description: Usage quota
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiUsageQuota" }

  # ── CART ──────────────────────────────────────────────────────────────
  /stores/{storeId}/cart:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [cart]
      operationId: cart_get
      summary: Get the current cart
      security:
        - bearerAuth: []
        - guestSession: []
      responses:
        "200":
          description: Cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }

  /stores/{storeId}/cart/items:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    post:
      tags: [cart]
      operationId: cart_items_add
      summary: Add an item to the cart
      security:
        - bearerAuth: []
        - guestSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId: { type: string }
                quantity: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "409":
          description: Requested quantity exceeds available stock
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }

  /stores/{storeId}/cart/items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - name: itemId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [cart]
      operationId: cart_items_update
      summary: Change an item's quantity
      security:
        - bearerAuth: []
        - guestSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
    delete:
      tags: [cart]
      operationId: cart_items_remove
      summary: Remove an item from the cart
      security:
        - bearerAuth: []
        - guestSession: []
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }

  # ── CHECKOUT ──────────────────────────────────────────────────────────
  /stores/{storeId}/checkout/session:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    post:
      tags: [checkout]
      operationId: checkout_session_create
      summary: Create a Stripe Checkout Session for the current cart
      description: |
        Returns a Stripe-hosted checkout URL (Implementation_Plan.md Phase 2: Stripe Checkout
        Session, not raw PaymentIntents). The resulting `Order` is only created once
        `webhooks_stripe_handle` receives a paid session; this endpoint does not itself create
        an order. The priced cart (lines, tax, shipping, total) is frozen as a checkout record
        first, and the order is later written from that snapshot, so it always matches what
        the shopper was charged. With a `discountCode` the discount is applied to the priced
        totals and sent to Stripe as a fixed-amount coupon, so Stripe charges exactly the
        discounted total. The pending checkout holds one use of a limited code until it is
        paid, expires (31 minutes) or fails, so a code cannot be overspent. A code that would
        make the order free, or leave less than Stripe's minimum charge, is refused. Answers
        503 when Stripe is not configured.
      security:
        - bearerAuth: []
        - guestSession: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                discountCode: { type: string, maxLength: 30, description: One code per order; case does not matter. }
                shippingZoneId: { type: string }
      responses:
        "201":
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                required: [checkoutUrl]
                properties:
                  checkoutUrl: { type: string, format: uri }
        "400":
          description: |
            Empty cart, an item no longer available, or a discount code that cannot be used
            (unknown, switched off, expired, used up, below its minimum spend, or one that would
            make the order too small to charge). The problem type for a code is
            `https://zyro.dev/errors/invalid-discount-code` and `detail` says why.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: An item in the cart is no longer in stock in the requested quantity
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: Stripe is not configured on this server
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }

  /stores/{storeId}/checkout/quote:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    post:
      tags: [checkout]
      operationId: checkout_quote_create
      summary: Preview the total for the current cart
      description: |
        Prices the cart exactly as `checkout_session_create` would (live prices, the store's tax
        rate, the chosen shipping zone) but saves nothing. The checkout page uses it so the
        browser never re-implements tax or shipping math.
      security:
        - bearerAuth: []
        - guestSession: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shippingZoneId: { type: string }
                discountCode: { type: string, maxLength: 30, description: One code per order; case does not matter. }
      responses:
        "200":
          description: Totals
          content:
            application/json:
              schema:
                type: object
                required: [currency, subtotal, taxAmount, shippingAmount, total]
                properties:
                  currency: { type: string }
                  discount:
                    type: [object, "null"]
                    description: The code that was applied, or null.
                    properties:
                      code: { type: string }
                      type: { type: string, enum: [percentage, fixed] }
                      value: { type: number }
                  subtotal: { type: number }
                  discountAmount: { type: number }
                  taxAmount: { type: number }
                  shippingAmount: { type: number }
                  total: { type: number }
        "400":
          description: Empty cart, an item no longer available, or a discount code that cannot be used (see `checkout_session_create`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "409":
          description: An item is no longer in stock in the requested quantity
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }

  /stores/{storeId}/checkout/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - name: sessionId
        in: path
        required: true
        description: The Stripe Checkout Session id from the confirmation URL (`session_id`).
        schema: { type: string }
    get:
      tags: [checkout]
      operationId: checkout_session_get
      summary: Where a checkout stands, for the confirmation page
      description: |
        The webhook, not the redirect, creates the order, so right after payment the order may
        not exist yet: the page polls until `state` is `completed`. `refunded` means the last
        units sold out between checkout and payment and the payment was returned automatically.
        Public: the unguessable Stripe session id is the only credential, and only
        order-confirmation details are returned (no ids, no payment data).
      security: []
      responses:
        "200":
          description: Checkout state
          content:
            application/json:
              schema:
                type: object
                required: [state, order]
                properties:
                  state: { type: string, enum: [pending, completed, expired, refunded, failed] }
                  order:
                    type: [object, "null"]
                    properties:
                      orderNumber: { type: integer }
                      status: { $ref: "#/components/schemas/OrderStatus" }
                      total: { type: number }
                      currency: { type: string }
                      email: { type: [string, "null"] }
                      shippingName: { type: [string, "null"] }
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            title: { type: string }
                            quantity: { type: integer }
                            lineTotal: { type: number }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── ORDERS ────────────────────────────────────────────────────────────
  /stores/{storeId}/orders:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [orders]
      operationId: orders_list
      summary: List orders for a store
      description: |
        Requires the `orders_write` staff permission (or owner) for the merchant order queue.
        Covers both sales channels; filter with `channel`. Newest first.
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OrderStatus" }
        - name: channel
          in: query
          schema: { $ref: "#/components/schemas/SalesChannel" }
        - name: q
          in: query
          description: An order number, or part of a customer email (case-insensitive).
          schema: { type: string, maxLength: 100 }
        - name: from
          in: query
          description: Only orders created at or after this time.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Only orders created at or before this time.
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Order page
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
                  pagination: { $ref: "#/components/schemas/PaginationInfo" }

  /stores/{storeId}/orders/{orderId}:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [orders]
      operationId: orders_get
      summary: Get a single order
      description: |
        Available to the merchant side (owner, or staff with `orders_write`) for any order, and
        to a logged-in shopper for orders placed under their own customer record. Anyone else
        gets 404 (not 403), so order ids cannot be probed.
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }

  /stores/{storeId}/orders/{orderId}/status:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [orders]
      operationId: orders_status_update
      summary: Update an order's fulfillment status
      description: |
        Requires the `orders_write` staff permission (or owner). Only `fulfilled` (from `paid`)
        and `cancelled` can be set by hand; anything else is 400. `refunded` goes through
        `orders_refund` because it moves money. Cancelling a `paid` order refunds it in full
        and puts the items back in stock, and additionally requires the `refunds` permission.
        An order that has been fulfilled or completed can only be refunded, not cancelled (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/OrderStatus" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          description: Status is not one that can be set by hand
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The order is not in a state that allows this change
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }

  /stores/{storeId}/orders/{orderId}/shipment:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [orders]
      operationId: orders_shipment_upsert
      summary: Create or update an online order's shipment
      description: |
        Requires the `orders_write` staff permission (or owner). Online orders only; POS
        orders are handed over in store (409). A shipment moves forward only:
        `pending` to `shipped` or `cancelled`, `shipped` to `delivered`. A new shipment may
        start as `pending` or `shipped`. Marking it `shipped` or `delivered` also moves a
        `paid` order to `fulfilled`. Send only the fields to change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                carrier: { type: string, maxLength: 100 }
                trackingNumber: { type: string, maxLength: 100 }
                status: { $ref: "#/components/schemas/ShipmentStatus" }
      responses:
        "200":
          description: The order with its shipment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          description: Empty body or invalid value
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Not allowed for this order or this shipment state
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }

  /stores/{storeId}/orders/{orderId}/refund:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [orders]
      operationId: orders_refund
      summary: Refund an order in full
      description: |
        Requires the `refunds` staff permission (or owner). Works for both channels: Stripe
        payments are refunded through Stripe, cash and card-terminal payments are recorded
        as returned. Every successful payment is refunded in full (one refund record per
        payment). For item-by-item returns of a POS sale use `pos_sale_return`; once part of a
        sale has been returned this whole-order refund answers 409.
        Safe to retry and to call twice at once: Stripe is called with an idempotency key,
        exactly one caller records the refund, and the other gets 409. If Stripe fails, the
        order is unchanged and the call can be repeated.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
                restock:
                  type: boolean
                  description: |
                    Put the items back in stock. Defaults to true for an order that has not
                    shipped (`paid`) and false for a `fulfilled` or `completed` one.
      responses:
        "200":
          description: Refund initiated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Order already refunded or not eligible
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }

  # ── POINT OF SALE ─────────────────────────────────────────────────────
  # Every route needs a bearer token. The owner may do everything; staff need `pos_sell` to
  # work the register, `refunds` to take items back, and `analytics_read` for the summary.
  /stores/{storeId}/pos/session:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [pos]
      operationId: pos_session
      summary: Who is at the register and what they may do
      description: Lets the register screen show only actions that will work. Requires `pos_sell`.
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosSession" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /stores/{storeId}/pos/settings:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    put:
      tags: [pos]
      operationId: pos_settings_update
      summary: Set the largest manual discount a cashier may give
      description: Owner only. A percentage of the sale's subtotal; owners and staff with `discounts_write` are not limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [maxCashierDiscountPercent]
              properties:
                maxCashierDiscountPercent: { type: number, minimum: 0, maximum: 100 }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  maxCashierDiscountPercent: { type: number }
        "400":
          description: Out of range
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /stores/{storeId}/pos/products:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [pos]
      operationId: pos_products_search
      summary: Find products by scanned code or by name
      description: |
        `code` matches a barcode or SKU exactly (what a scanner types). `q` matches part of a
        title or SKU, ignoring case; characters such as `(` and `*` are plain text. Each result
        carries on-hand stock at the store's location.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: code, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, default: 30, maximum: 60 } }
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PosProduct" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /stores/{storeId}/pos/customers:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [pos]
      operationId: pos_customers_search
      summary: Find customers by name, email or phone
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Up to 20 customers of this store, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PosCustomer" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [pos]
      operationId: pos_customers_create
      summary: Add a customer, or find the one with this email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PosCustomerInput" }
      responses:
        "201":
          description: The customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosCustomer" }
        "400":
          description: Nothing to save, or an invalid email
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /stores/{storeId}/pos/shift:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [pos]
      operationId: pos_shift_current
      summary: The open shift at this register, with live totals
      responses:
        "200":
          description: The open shift, or null when none is open
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/PosShift" }
                  - { type: "null" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /stores/{storeId}/pos/shift/open:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    post:
      tags: [pos]
      operationId: pos_shift_open
      summary: Open the drawer with a starting float
      description: One shift can be open per register at a time, even when two requests arrive together.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openingFloat]
              properties:
                openingFloat: { type: number, minimum: 0 }
      responses:
        "201":
          description: Shift opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosShift" }
        "400":
          description: Invalid float
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A shift is already open
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }

  /stores/{storeId}/pos/shift/close:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    post:
      tags: [pos]
      operationId: pos_shift_close
      summary: Count the drawer and close the shift
      description: |
        Only the person who opened the shift, or the owner, may close it. Sales already in
        progress finish and are counted; any sale that starts afterwards is refused. Expected
        cash is float plus cash sales minus cash paid back on refunds and returns; the
        variance is counted minus expected (negative means short).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [countedCash]
              properties:
                countedCash: { type: number, minimum: 0 }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Closed shift with its frozen totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosShift" }
        "400":
          description: Invalid count
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: No shift is open
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }

  /stores/{storeId}/pos/quote:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    post:
      tags: [pos]
      operationId: pos_quote
      summary: Price a cart exactly as a sale would be charged
      description: |
        Prices from the live catalog and the store's tax settings (clients never send prices),
        applies an optional manual discount, checks it against the cashier's limit, and lists
        any item that is short of stock. The register calls this on every cart change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/PosCartItem" }
                discount: { oneOf: [{ $ref: "#/components/schemas/ManualDiscount" }, { type: "null" }] }
                discountCode: { type: string, maxLength: 30, description: "A store discount code instead of a manual discount; the two cannot be combined (400). Set by the merchant, so not held to the cashier's manual-discount limit." }
      responses:
        "200":
          description: Priced cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosQuote" }
        "400":
          description: Empty cart, bad quantity, or a percentage over 100
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: The discount is over the cashier's limit
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /stores/{storeId}/pos/sales:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [pos]
      operationId: pos_sales_list
      summary: Sales history for the register
      parameters:
        - { name: q, in: query, description: "An order number, or part of a customer name or email.", schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: POS orders, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
                  pagination: { $ref: "#/components/schemas/PaginationInfo" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [pos]
      operationId: pos_sale_create
      summary: Ring up a sale
      description: |
        Needs an open shift. Prices are taken from the catalog; the payments must add up to the
        total exactly. For cash, `amount` is what pays for the sale and `tendered` is what the
        customer handed over (change is the difference). Stock, the order and the payments are
        written in one transaction: if any part fails, nothing is recorded.
        Send a `clientRequestId` (one per sale attempt) so a retried or double-submitted
        request returns the original sale (200) instead of creating a second (201).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaleInput" }
            examples:
              split_payment:
                value:
                  items: [{ productId: 64b7f0f0f0f0f0f0f0f0f0f0, quantity: 2 }]
                  payments: [{ method: card, amount: 12.10 }, { method: cash, amount: 31.10, tendered: 40 }]
                  clientRequestId: sale-7f3a9c21
      responses:
        "201":
          description: Sale completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "200":
          description: The same clientRequestId was already used; the original sale is returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "400":
          description: Invalid cart, payments that do not equal the total, tendered less than the cash payment, or nothing to charge
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Discount over the cashier's limit
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No open shift, or not enough stock
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }

  /stores/{storeId}/pos/sales/{orderId}:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [pos]
      operationId: pos_sale_get
      summary: One sale, with everything a receipt needs
      responses:
        "200":
          description: The sale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /stores/{storeId}/pos/sales/{orderId}/returns:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [pos]
      operationId: pos_sale_return
      summary: Take some or all items of a sale back
      description: |
        Requires the `refunds` permission (or owner). Refunds each returned unit's price less
        its share of the sale's discount plus its share of the tax; returning the last units
        settles to the exact remainder so the parts always add up to what was paid. Stock goes
        back on the shelf unless `restock` is false (damaged goods). Cash paid back comes out
        of the open drawer. When every unit is back the sale becomes `refunded`. Two returns
        of the same unit at once: one succeeds, the other gets 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReturnInput" }
      responses:
        "201":
          description: The sale with its new return
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "400":
          description: Empty return, or an item that is not part of this sale
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: More than is left to return, or the sale is already refunded
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }

  /stores/{storeId}/pos/held:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [pos]
      operationId: pos_held_list
      summary: Parked carts
      responses:
        "200":
          description: Held sales, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HeldSale" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [pos]
      operationId: pos_held_create
      summary: Park the current cart to serve someone else
      description: Stores only product ids and quantities, never prices, and reserves no stock. At most 50 at a time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/PosCartItem" }
                discount: { oneOf: [{ $ref: "#/components/schemas/ManualDiscount" }, { type: "null" }] }
                customerId: { type: string }
                label: { type: string, maxLength: 60 }
      responses:
        "201":
          description: Parked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeldSale" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Too many held sales
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }

  /stores/{storeId}/pos/held/{heldId}/resume:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - name: heldId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [pos]
      operationId: pos_held_resume
      summary: Take a parked cart back to the register
      description: Returns the cart and removes it in one step, so two registers cannot both resume it. Prices are re-read from the catalog by the next quote.
      responses:
        "200":
          description: The cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeldSale" }
        "404": { $ref: "#/components/responses/NotFound" }

  /stores/{storeId}/pos/held/{heldId}:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - name: heldId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [pos]
      operationId: pos_held_discard
      summary: Discard a parked cart
      responses:
        "204": { description: Discarded }
        "404": { $ref: "#/components/responses/NotFound" }

  /stores/{storeId}/pos/reports/daily:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [pos]
      operationId: pos_report_daily
      summary: What the register took and paid back in a time window
      description: |
        Requires `analytics_read` (or owner). The caller chooses the window, normally the
        store's local day, so no time zone is assumed here. Amounts include tax; net is takings
        minus money paid back. At most 32 days.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, description: Exclusive end., schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosDailyReport" }
        "400":
          description: Missing or reversed window, or longer than 32 days
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── SHIPPING ──────────────────────────────────────────────────────────
  /stores/{storeId}/shipping-zones:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [shipping]
      operationId: shipping_zones_list
      summary: List a store's shipping zones
      description: Public, so the storefront can show shipping options (name and rate) before checkout.
      security: []
      responses:
        "200":
          description: Shipping zones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShippingZone" }
    post:
      tags: [shipping]
      operationId: shipping_zones_create
      summary: Create a shipping zone
      description: Requires the `orders_write` staff permission (or owner).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShippingZoneInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShippingZone" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /stores/{storeId}/shipping-zones/{zoneId}:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - name: zoneId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [shipping]
      operationId: shipping_zones_update
      summary: Update a shipping zone
      description: Requires the `orders_write` staff permission (or owner).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShippingZoneInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShippingZone" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [shipping]
      operationId: shipping_zones_delete
      summary: Delete a shipping zone
      description: Requires the `orders_write` staff permission (or owner).
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── DISCOUNTS ─────────────────────────────────────────────────────────
  /stores/{storeId}/discount-codes:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [discounts]
      operationId: discount_codes_list
      summary: List a store's discount codes
      description: Requires the `discounts_write` staff permission (or owner). Newest first, at most 200. Each code carries its `status` (active, inactive, expired or used_up) and how many times it has been used.
      responses:
        "200":
          description: Discount codes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DiscountCode" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [discounts]
      operationId: discount_codes_create
      summary: Create a discount code
      description: |
        Requires the `discounts_write` staff permission (or owner). Codes are stored upper-case
        and matched ignoring case, and are unique within a store (two stores can both have
        SAVE10). One code per order, no stacking, no partial application.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscountCodeInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscountCode" }
        "400":
          description: Invalid code format, a value of zero or a percentage over 100, an expiry in the past, or a usage limit below 1
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Code already exists for this store
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }

  /stores/{storeId}/discount-codes/{codeId}:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - name: codeId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [discounts]
      operationId: discount_codes_update
      summary: Activate, deactivate, or adjust a discount code
      description: |
        Requires the `discounts_write` staff permission (or owner). The code, type and value
        cannot be changed once created (create a new code instead), so past orders stay
        explainable. `null` removes a limit, expiry or minimum. The usage limit cannot be set
        below the number of times the code has already been used.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active: { type: boolean }
                usageLimit: { type: [integer, "null"], minimum: 1 }
                expiresAt: { type: [string, "null"], format: date-time }
                minSubtotal: { type: [number, "null"], minimum: 0 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscountCode" }
        "400":
          description: Nothing to change, or a usage limit below the times already used
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /stores/{storeId}/discount-codes/validate:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    post:
      tags: [discounts]
      operationId: discount_codes_validate
      summary: Validate a discount code against the current cart total
      description: |
        Lets the storefront say "code accepted, you save X" before checkout. Advisory: the
        authoritative check happens again in `checkout_quote_create` and
        `checkout_session_create`, against the real cart. Open to guests and logged-in
        shoppers. A code held by another shopper's pending checkout counts as used. Wrong
        codes are rate limited per address (429), so codes cannot be guessed; accepted codes
        do not count against the limit.
      security:
        - bearerAuth: []
        - guestSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, cartTotal]
              properties:
                code: { type: string, maxLength: 30 }
                cartTotal: { type: number, minimum: 0, description: "The cart subtotal before discount, tax and shipping." }
      responses:
        "200":
          description: "Valid, discount amount returned"
          content:
            application/json:
              schema:
                type: object
                required: [valid, discountAmount]
                properties:
                  valid: { type: boolean, enum: [true] }
                  code: { type: string }
                  type: { type: string, enum: [percentage, fixed] }
                  value: { type: number }
                  discountAmount: { type: number }
        "400":
          description: |
            Code unknown, switched off, expired, used up, or the cart is below its minimum spend
            (problem type `https://zyro.dev/errors/invalid-discount-code`, `detail` says why).
            A code that belongs to another store looks the same as an unknown one.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ── AI ASSISTANT ──────────────────────────────────────────────────────
  /stores/{storeId}/assistant/chat:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    post:
      tags: [ai-assistant]
      operationId: assistant_chat_send
      summary: Send a message to the AI shopping assistant
      description: |
        Routed through the same AI orchestrator and quota system as `ai_content_generate`
        (Implementation_Plan.md Phase 5), so a store's chat volume and content-generation
        volume draw from the same monthly quota.
      security:
        - bearerAuth: []
        - guestSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversationId, message]
              properties:
                conversationId: { type: string }
                message: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                type: object
                required: [reply, conversationId]
                properties:
                  reply: { type: string }
                  conversationId: { type: string }
                  suggestedProducts:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
        "402":
          description: Monthly AI usage quota exhausted
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }

  # ── ANALYTICS ─────────────────────────────────────────────────────────
  /stores/{storeId}/analytics/summary:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [analytics]
      operationId: analytics_summary_get
      summary: Sales, refunds, channel split, daily trend and top products for a period
      description: |
        Requires the `analytics_read` staff permission (or owner). Computed on demand with
        Postgres aggregate queries over the same orders both channels write, and cached in
        Redis for 5 minutes (Implementation_Plan.md Phase 3) instead of a data warehouse, so a
        sale made in the last few minutes may not show yet; `cached` and `generatedAt` say so.
        If Redis is unavailable the figures are still computed fresh.

        Definitions (identical to the POS daily report, so the two agree): a sale is an order
        that has a payment which was taken (succeeded or since refunded). Gross sales is the
        sum of those orders' totals (after discounts, with tax and shipping). A refund counts
        in the period it is paid back, whichever period the sale was in (a whole-order refund
        of a split payment is one refund record per payment). Net sales = gross sales minus
        refunds. Product figures cover units still kept: sales refunded or cancelled in full
        and units returned item by item are left out; revenue is before order-level discounts;
        margin is price minus the cost recorded at sale time, for items that had a cost.

        With no `from` and `to` the last 30 days are reported, ending on the next five-minute
        mark. `from` is inclusive and `to` exclusive; at most 366 days. `tzOffsetMinutes`
        decides where one day ends and the next begins in `daily`; totals do not depend on it.
      parameters:
        - { name: from, in: query, description: "Start of the period (inclusive). Send with `to`.", schema: { type: string, format: date-time } }
        - { name: to, in: query, description: "End of the period (exclusive). Send with `from`.", schema: { type: string, format: date-time } }
        - { name: tzOffsetMinutes, in: query, description: "Minutes east of UTC, for example 300 for Pakistan.", schema: { type: integer, minimum: -840, maximum: 840, default: 0 } }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsSummary" }
        "400":
          description: "Only one of `from` and `to`, `to` not after `from`, longer than 366 days, a bad date, or a time zone offset out of range"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /stores/{storeId}/analytics/cart-recovery:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [analytics]
      operationId: analytics_cart_recovery_get
      summary: Abandoned-cart recovery funnel (sent / opened / clicked / converted)
      responses:
        "200":
          description: Funnel counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartRecoveryFunnel" }

  # ── WEBHOOKS ──────────────────────────────────────────────────────────
  /webhooks/stripe:
    post:
      tags: [webhooks]
      operationId: webhooks_stripe_handle
      summary: Stripe webhook receiver
      description: |
        Not tenant-scoped by path; the tenant is resolved from Stripe metadata attached at
        `checkout_session_create` time. This is the single source of truth for order creation
        (Implementation_Plan.md Phase 2); the client-side checkout redirect never creates an order.
        The signature is verified over the raw request body before anything is processed. Handles
        `checkout.session.completed` and `checkout.session.async_payment_succeeded` (an order is
        created only when `payment_status` is not `unpaid`), plus `async_payment_failed` and
        `expired`. Safe to deliver more than once: each session becomes at most one order. If the
        last units sold out between checkout and payment, the payment is refunded automatically.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Stripe event payload, verified against `Stripe-Signature` before processing.
      responses:
        "200": { description: Event processed (or intentionally ignored) }
        "503":
          description: Stripe is not configured on this server
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "400":
          description: Signature missing or verification failed
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    guestSession:
      type: apiKey
      in: header
      name: X-Guest-Session-Id

  parameters:
    StoreId:
      name: storeId
      in: path
      required: true
      description: Tenant identifier. Every operation on a tenant-scoped resource must supply this explicitly.
      schema: { type: string }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, default: 0, minimum: 0 }

  responses:
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Caller lacks the required staff permission
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: |
        Too many attempts. Wait for the number of seconds in `Retry-After` before trying again.
        Every API call is also capped per address (600 per minute); registration, login and
        session refresh have tighter limits. Standard `RateLimit` headers describe the window.
      headers:
        Retry-After:
          description: Seconds until the caller may try again.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      description: RFC 7807 problem details.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: Stable identifier for this error category.
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
      examples:
        - type: https://zyro.dev/errors/ai-quota-exhausted
          title: Monthly AI usage quota exhausted
          status: 402
          detail: This store has used all 100 AI generations included this month.

    PaginationInfo:
      type: object
      required: [total, limit, offset]
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    AuthSession:
      description: |
        The refresh token is never in this body; it's delivered exclusively via an
        httpOnly `Set-Cookie` header (see `auth_register`), so it can't be read by
        JavaScript on the frontend.
      type: object
      required: [accessToken, user]
      properties:
        accessToken: { type: string }
        user: { $ref: "#/components/schemas/User" }

    User:
      type: object
      required: [id, email]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }

    Store:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        logoUrl: { type: string, format: uri }
        themeColor: { type: string }
        currency: { type: string, description: "The store's currency (ISO code), used to format prices." }

    StaffPermission:
      type: string
      enum: [products_write, orders_write, discounts_write, analytics_read, pos_sell, inventory_write, refunds]

    StaffMember:
      type: object
      required: [id, userId, permissions]
      properties:
        id: { type: string }
        userId: { type: string }
        email: { type: string, format: email }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/StaffPermission" }

    ProductInput:
      type: object
      required: [title, price, stock, category]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        price: { type: number, minimum: 0 }
        stock:
          type: integer
          minimum: 0
          description: |
            On-hand quantity at the store's default location. Stored in the Postgres inventory
            tables (the single source of truth shared by the online store and the POS), not on
            the product document. Writing a different value records a stock adjustment.
        sku:
          type: string
          maxLength: 100
          description: Unique per store when set.
        barcode:
          type: string
          maxLength: 100
          description: Unique per store when set. Used for barcode lookup at the POS.
        taxable:
          type: boolean
          default: true
          description: Whether the store's tax rate applies to this product.
        costPrice:
          type: number
          minimum: 0
          description: Merchant-only cost, used for margin analytics. Never shown to shoppers.
        category: { type: string }
        images:
          type: array
          items: { type: string, format: uri }
          maxItems: 10

    Product:
      allOf:
        - $ref: "#/components/schemas/ProductInput"
        - type: object
          required: [id, storeId]
          properties:
            id: { type: string }
            storeId: { type: string }
            averageRating: { type: [number, "null"], description: "Mean of the published reviews, two decimals; null when there are none. Computed on read." }
            reviewCount: { type: integer, description: "Published reviews." }
            aiDescriptionStatus:
              type: [string, "null"]
              enum: [draft, published, null]
      examples:
        - id: prod_01HXYZ
          storeId: store_01ABCD
          title: Wireless Earbuds Pro
          description: Crisp sound, all-day battery, and a snug fit for workouts or commutes.
          price: 49.00
          stock: 42
          category: Electronics
          images: ["https://cdn.zyro.dev/products/earbuds-1.jpg"]
          aiDescriptionStatus: published

    ProductReview:
      type: object
      description: "A published review as shoppers see it. No reviewer id or email."
      required: [id, productId, authorName, rating]
      properties:
        id: { type: string }
        productId: { type: string }
        authorName: { type: string, description: "The reviewer as shown, for example Sam O., or Customer." }
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: [string, "null"] }
        comment: { type: [string, "null"] }
        verifiedPurchase: { type: boolean }
        merchantReply: { type: [string, "null"] }
        merchantRepliedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OwnReview:
      description: "A review as its author sees it: adds the moderation status."
      allOf:
        - $ref: "#/components/schemas/ProductReview"
        - type: object
          properties:
            status: { type: string, enum: [published, hidden] }

    ModerationReview:
      allOf:
        - $ref: "#/components/schemas/OwnReview"
        - type: object
          properties:
            productTitle: { type: string }
    AiGeneratedContent:
      type: object
      required: [id, productId, status, content]
      properties:
        id: { type: string }
        productId: { type: string }
        status: { type: string, enum: [draft, published] }
        content: { type: string }
        model: { type: string }
        editedByMerchant: { type: boolean }

    AiUsageQuota:
      type: object
      required: [month, generationsUsed, generationsLimit, chatMessagesUsed, chatMessagesLimit]
      properties:
        month: { type: string, description: "YYYY-MM" }
        generationsUsed: { type: integer }
        generationsLimit: { type: integer }
        chatMessagesUsed: { type: integer }
        chatMessagesLimit: { type: integer }

    CartItem:
      type: object
      required: [id, productId, quantity, unitPrice]
      description: |
        Carts store only product ids and quantities (in Redis, 7-day expiry). Title, image,
        price and stock are looked up fresh on every read, so a cart never holds a stale price.
      properties:
        id: { type: string, description: Same as productId; use it as `itemId` in the item routes. }
        productId: { type: string }
        title: { type: string }
        imageUrl: { type: [string, "null"] }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: number }
        lineTotal: { type: number }
        availableStock:
          type: integer
          description: Units the store can currently ship online; warn the shopper when quantity exceeds it.

    Cart:
      type: object
      required: [items, subtotal]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CartItem" }
        subtotal: { type: number }
        currency: { type: string, description: "The store's currency, for formatting." }

    OrderStatus:
      type: string
      description: |
        `paid`: online order paid, awaiting fulfilment. `completed`: in-store (POS) sale,
        paid and handed over.
      enum: [pending, paid, fulfilled, completed, cancelled, refunded]

    SalesChannel:
      type: string
      description: Which sales channel created the order. Both share one order, inventory and payment model.
      enum: [online, pos]

    OrderItem:
      type: object
      required: [id, productId, productTitleSnapshot, unitPrice, quantity, lineTotal]
      properties:
        id: { type: string, description: Identifies the line when returning items. }
        productId: { type: string }
        productTitleSnapshot: { type: string }
        unitPrice: { type: number }
        quantity: { type: integer }
        returnedQuantity: { type: integer, description: Units already taken back through item returns. }
        lineTotal: { type: number }

    Order:
      type: object
      required: [id, storeId, status, total, items]
      properties:
        id: { type: string }
        storeId: { type: string }
        orderNumber: { type: integer, description: "Human-readable number, unique per store." }
        channel: { $ref: "#/components/schemas/SalesChannel" }
        locationId: { type: [string, "null"] }
        cashierUserId: { type: [string, "null"], description: The user who rang up a POS sale. }
        shiftId: { type: [string, "null"], description: The register shift a POS sale was rung up in. }
        discountReason: { type: [string, "null"], description: "Why a manual POS discount was given, or Code X when a discount code was used." }
        discountCode: { type: [string, "null"], description: "The discount code the order used, when it used one." }
        customerId: { type: [string, "null"] }
        customer:
          type: [object, "null"]
          properties:
            name: { type: [string, "null"] }
            email: { type: [string, "null"] }
        guestEmail: { type: [string, "null"] }
        shippingName: { type: [string, "null"], description: Collected by Stripe Checkout; null for POS orders. }
        shippingAddress:
          type: [object, "null"]
          description: Where an online order ships, as collected by Stripe Checkout.
          properties:
            line1: { type: [string, "null"] }
            line2: { type: [string, "null"] }
            city: { type: [string, "null"] }
            state: { type: [string, "null"] }
            postalCode: { type: [string, "null"] }
            country: { type: [string, "null"], description: ISO country code. }
        status: { $ref: "#/components/schemas/OrderStatus" }
        subtotal: { type: number }
        discountAmount: { type: number }
        taxAmount: { type: number }
        shippingAmount: { type: number }
        total: { type: number }
        currency: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        payments:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              method: { type: string, enum: [cash, card, stripe, other] }
              amount: { type: number, description: "What was applied to the order (for cash, without the change)." }
              tenderedAmount: { type: [number, "null"], description: Cash only; what the customer handed over. }
              changeGiven: { type: [number, "null"], description: Cash only; tendered minus amount. }
              status: { type: string, enum: [pending, succeeded, failed, refunded] }
        returns:
          type: array
          description: Item returns (POS sales). Whole-order refunds are in `refunds`.
          items: { $ref: "#/components/schemas/OrderReturn" }
        refunds:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              paymentId: { type: string }
              amount: { type: number }
              method: { type: string, enum: [cash, card, stripe, other] }
              reason: { type: [string, "null"] }
              restocked: { type: boolean }
              createdAt: { type: string, format: date-time }
        shipment:
          type: [object, "null"]
          description: Set once a shipment exists. Never present on POS orders.
          properties:
            carrier: { type: [string, "null"] }
            trackingNumber: { type: [string, "null"] }
            status: { $ref: "#/components/schemas/ShipmentStatus" }
            shippedAt: { type: [string, "null"], format: date-time }
            deliveredAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    OrderReturn:
      type: object
      properties:
        id: { type: string }
        amount: { type: number }
        method: { type: string, enum: [cash, card, other], description: How the customer was paid back. }
        reason: { type: [string, "null"] }
        restocked: { type: boolean }
        createdByUserId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              orderItemId: { type: string }
              productId: { type: string }
              productTitleSnapshot: { type: string }
              quantity: { type: integer }
              amount: { type: number }

    PosSession:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: string }
            name: { type: [string, "null"] }
            email: { type: string }
        isOwner: { type: boolean }
        permissions:
          type: object
          properties:
            sell: { type: boolean }
            refunds: { type: boolean }
            analytics: { type: boolean }
            unlimitedDiscounts: { type: boolean }
        store:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            currency: { type: string }
            taxRate: { type: number, description: "Percentage, for example 8.25." }
        settings:
          type: object
          properties:
            maxCashierDiscountPercent: { type: number }

    PosProduct:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        price: { type: number }
        taxable: { type: boolean }
        sku: { type: [string, "null"] }
        barcode: { type: [string, "null"] }
        category: { type: string }
        image: { type: [string, "null"] }
        stock: { type: integer, description: On hand at the store's location. }

    PosCustomerInput:
      type: object
      description: At least one field is required. With an email, an existing customer with that email is reused.
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 40 }

    PosCustomer:
      type: object
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }

    PosCartItem:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string }
        quantity: { type: integer, minimum: 1 }

    ManualDiscount:
      type: object
      required: [type, value]
      properties:
        type: { type: string, enum: [percentage, fixed] }
        value: { type: number, exclusiveMinimum: 0 }
        reason: { type: string, maxLength: 200 }

    PosQuote:
      type: object
      properties:
        currency: { type: string }
        taxRate: { type: number }
        lines:
          type: array
          items:
            type: object
            properties:
              productId: { type: string }
              title: { type: string }
              unitPrice: { type: number }
              quantity: { type: integer }
              taxable: { type: boolean }
              lineTotal: { type: number }
        subtotal: { type: number }
        discountAmount: { type: number }
        discountCode: { type: [string, "null"], description: "The store code applied, if any." }
        discountPercent: { type: number }
        taxAmount: { type: number }
        total: { type: number }
        shortages:
          type: array
          description: Items the shelf cannot cover; a sale with any of these is refused.
          items:
            type: object
            properties:
              productId: { type: string }
              requested: { type: integer }
              available: { type: integer }

    SaleInput:
      type: object
      required: [items, payments]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PosCartItem" }
        discount: { oneOf: [{ $ref: "#/components/schemas/ManualDiscount" }, { type: "null" }] }
        discountCode: { type: string, maxLength: 30, description: A store discount code instead of a manual discount. Its use is counted inside the sale; if it stopped being usable meanwhile (or a racing sale took the last use) the sale is refused (400 or 409). }
        customerId: { type: string }
        customer: { $ref: "#/components/schemas/PosCustomerInput" }
        payments:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: object
            required: [method, amount]
            properties:
              method: { type: string, enum: [cash, card, other] }
              amount: { type: number, exclusiveMinimum: 0 }
              tendered: { type: number, description: Cash only; at least `amount`. }
        clientRequestId: { type: string, minLength: 8, maxLength: 80 }

    Sale:
      description: An Order (channel pos) plus what a receipt needs.
      allOf:
        - { $ref: "#/components/schemas/Order" }
        - type: object
          properties:
            store:
              type: object
              properties:
                name: { type: string }
                currency: { type: string }
            cashier:
              type: [object, "null"]
              properties:
                id: { type: string }
                name: { type: string }
            changeDue: { type: number, description: Total cash change handed back. }

    ReturnInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [orderItemId, quantity]
            properties:
              orderItemId: { type: string }
              quantity: { type: integer, minimum: 1 }
        refundMethod:
          type: string
          enum: [cash, card, other]
          description: Defaults to how the sale was mostly paid (cash when that was not cash, card or other).
        reason: { type: string, maxLength: 500 }
        restock: { type: boolean, description: Put items back on the shelf. Default true. }

    PosShift:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [open, closed] }
        locationId: { type: string }
        openedAt: { type: string, format: date-time }
        closedAt: { type: [string, "null"], format: date-time }
        openedBy:
          type: object
          properties:
            id: { type: string }
            name: { type: [string, "null"] }
        closedBy:
          type: [object, "null"]
          properties:
            id: { type: string }
            name: { type: [string, "null"] }
        openingFloat: { type: number }
        expectedCash: { type: number, description: Live while open; frozen when closed. }
        countedCash: { type: [number, "null"] }
        variance: { type: [number, "null"], description: Counted minus expected; negative is short. }
        note: { type: [string, "null"] }
        totals:
          type: object
          properties:
            salesCount: { type: integer }
            grossSales: { type: number }
            cashSales: { type: number }
            cardSales: { type: number }
            otherSales: { type: number }
            refundsTotal: { type: number }
            cashRefunds: { type: number }
            expectedCash: { type: number }

    HeldSale:
      type: object
      properties:
        id: { type: string }
        label: { type: [string, "null"] }
        customerId: { type: [string, "null"] }
        customerName: { type: [string, "null"] }
        cashierName: { type: [string, "null"] }
        itemCount: { type: integer }
        items:
          type: array
          items:
            type: object
            properties:
              productId: { type: string }
              title: { type: string }
              quantity: { type: integer }
        discount: { oneOf: [{ $ref: "#/components/schemas/ManualDiscount" }, { type: "null" }] }
        createdAt: { type: string, format: date-time }

    PosDailyReport:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        currency: { type: string }
        salesCount: { type: integer }
        grossSales: { type: number }
        discountsGiven: { type: number }
        taxCollected: { type: number }
        refunds:
          type: object
          properties:
            count: { type: integer }
            total: { type: number }
        netSales: { type: number }
        averageSale: { type: number }
        byPaymentMethod:
          type: array
          items:
            type: object
            properties:
              method: { type: string }
              sales: { type: number }
              refunds: { type: number }
              net: { type: number }
        byCashier:
          type: array
          items:
            type: object
            properties:
              userId: { type: [string, "null"] }
              name: { type: string }
              salesCount: { type: integer }
              sales: { type: number }
              refunds: { type: number }
              net: { type: number }
        topItems:
          type: array
          items:
            type: object
            properties:
              productId: { type: string }
              title: { type: string }
              quantity: { type: integer }
              revenue: { type: number }
        shifts:
          type: array
          items: { $ref: "#/components/schemas/PosShift" }

    ShipmentStatus:
      type: string
      enum: [pending, shipped, delivered, cancelled]

    ShippingZoneInput:
      type: object
      required: [name, region, rateAmount]
      properties:
        name: { type: string }
        region: { type: string }
        rateAmount: { type: number, minimum: 0 }

    ShippingZone:
      allOf:
        - $ref: "#/components/schemas/ShippingZoneInput"
        - type: object
          required: [id]
          properties:
            id: { type: string }

    DiscountType:
      type: string
      enum: [percentage, fixed]

    DiscountCodeInput:
      type: object
      required: [code, type, value]
      properties:
        code: { type: string, pattern: "^[A-Za-z0-9_-]{3,30}$", description: "Letters, digits, hyphens and underscores; stored upper-case." }
        type: { $ref: "#/components/schemas/DiscountType" }
        value: { type: number, exclusiveMinimum: 0, description: "A percentage up to 100 for `percentage`, an amount in the store currency for `fixed`." }
        minSubtotal: { type: number, minimum: 0, description: The smallest cart subtotal (before discount and tax) the code applies to. }
        usageLimit: { type: integer, minimum: 1, description: Omit for unlimited. }
        expiresAt: { type: string, format: date-time, description: Must be in the future when creating. }
        active: { type: boolean, default: true }

    DiscountCode:
      type: object
      required: [id, code, type, value, usageCount, active, status]
      properties:
        id: { type: string }
        code: { type: string }
        type: { $ref: "#/components/schemas/DiscountType" }
        value: { type: number }
        minSubtotal: { type: [number, "null"] }
        usageLimit: { type: [integer, "null"] }
        expiresAt: { type: [string, "null"], format: date-time }
        usageCount: { type: integer, description: Orders that have used the code. Refunds do not give a use back. }
        active: { type: boolean }
        status: { type: string, enum: [active, inactive, expired, used_up] }
        createdAt: { type: string, format: date-time }

    AnalyticsChannelFigures:
      type: object
      properties:
        orders: { type: integer }
        grossSales: { type: number }
        refunds: { type: number }
        netSales: { type: number }

    AnalyticsSummary:
      type: object
      required: [range, currency, totals, byChannel, daily, topProducts, generatedAt, cached]
      properties:
        range:
          type: object
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
            days: { type: integer, description: "Local calendar days the period touches, so `daily` has this many entries." }
            tzOffsetMinutes: { type: integer }
        currency: { type: string }
        generatedAt: { type: string, format: date-time }
        cached: { type: boolean, description: "True when served from the 5-minute cache." }
        totals:
          type: object
          properties:
            orders: { type: integer }
            grossSales: { type: number }
            discountsGiven: { type: number }
            taxCollected: { type: number }
            shippingCharged: { type: number }
            refunds:
              type: object
              properties:
                count: { type: integer, description: "Refund records (one per refunded payment or return)." }
                total: { type: number }
            netSales: { type: number }
            averageOrderValue: { type: number, description: "Gross sales divided by orders." }
            unitsSold: { type: integer }
            productMargin: { type: number, description: "Price minus recorded cost over kept units that had a cost, before order-level discounts." }
            costCoveragePercent: { type: number, description: "Share of kept units that had a cost on record; margin only speaks for these." }
            newCustomers: { type: integer }
        byChannel:
          type: array
          description: "Always both channels, online then pos."
          items:
            allOf:
              - $ref: "#/components/schemas/AnalyticsChannelFigures"
              - type: object
                properties:
                  channel: { $ref: "#/components/schemas/SalesChannel" }
                  averageOrderValue: { type: number }
                  shareOfNetSales: { type: number, description: "Percent of the store's net sales." }
        daily:
          type: array
          description: "One entry per local day, quiet days as zeros. Refunds appear on the day they were paid back, so a day's net can be negative."
          items:
            type: object
            properties:
              date: { type: string, format: date }
              online: { $ref: "#/components/schemas/AnalyticsChannelFigures" }
              pos: { $ref: "#/components/schemas/AnalyticsChannelFigures" }
              netSales: { type: number }
        topProducts:
          type: array
          description: "Up to 10, most units first."
          items:
            type: object
            properties:
              productId: { type: string }
              title: { type: string }
              unitsSold: { type: integer }
              revenue: { type: number }
              unitsOnline: { type: integer }
              unitsPos: { type: integer }
              productMargin: { type: [number, "null"], description: "Null when no unit of the product had a cost on record." }
    CartRecoveryFunnel:
      type: object
      required: [sent, opened, clicked, converted]
      properties:
        sent: { type: integer }
        opened: { type: integer }
        clicked: { type: integer }
        converted: { type: integer }
